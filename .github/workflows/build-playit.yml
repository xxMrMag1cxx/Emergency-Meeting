# Builds playitd (playit.gg's tunnel program) for Mac from their open source
# code and puts it in playit/playitd-macos. Works on both Intel Macs and Macs
# with Apple silicon (M1, M2 ...), from macOS 11.
#
# Runs by itself when playit/VERSION changes. You can also start it by hand
# on GitHub: the Actions tab -> "Build playitd for Mac" -> Run workflow.
name: Build playitd for Mac

on:
  workflow_dispatch:
  push:
    paths:
      - playit/VERSION

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the source code of playit-agent
        run: |
          VERSION="$(tr -d '[:space:]' < playit/VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "v$VERSION" https://github.com/playit-cloud/playit-agent.git "$RUNNER_TEMP/playit-agent"

      - name: Build for Intel and Apple silicon
        working-directory: ${{ runner.temp }}/playit-agent
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked -p playitd --target x86_64-apple-darwin
          cargo build --release --locked -p playitd --target aarch64-apple-darwin

      - name: Combine into one file and test
        run: |
          SRC="$RUNNER_TEMP/playit-agent"
          lipo -create -output playit/playitd-macos \
            "$SRC/target/x86_64-apple-darwin/release/playitd" \
            "$SRC/target/aarch64-apple-darwin/release/playitd"
          codesign --force --sign - playit/playitd-macos
          chmod +x playit/playitd-macos
          cp "$SRC/LICENSE.txt" playit/LICENSE-playit.txt
          lipo -info playit/playitd-macos
          ls -l playit/playitd-macos
          ./playit/playitd-macos --help
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./playit/playitd-macos --help > /dev/null && echo "The Intel part starts too"
          fi

      - name: Save in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playit/playitd-macos playit/LICENSE-playit.txt
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "playitd $VERSION for Mac (built by GitHub Actions)"
          git pull --rebase
          git push
